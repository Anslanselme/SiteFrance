<body>
  <div>
    <h1>Merci pour votre commande !</h1>
    <p>Vous recevrez un e-mail de confirmation de la part de Stripe.<br>
       Votre commande part en préparation dès validation du paiement.</p>
    <p><a href="/">&larr; Retour à la boutique</a></p>
  </div>
<script>
  (function(){
    var params=new URLSearchParams(location.search),
        value=parseFloat(params.get('value')),
        currency=params.get('currency')||'EUR',
        ids=(params.get('ids')||'').split(',').filter(Boolean);
    if(window.fbq && value){
      fbq('track','Purchase',{value:value,currency:currency,content_ids:ids,content_type:'product'});
    }
  })();
</script>
